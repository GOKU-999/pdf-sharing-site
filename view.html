<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View PDF - PDF Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-file-pdf"></i> PDF Share
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="upload.html">Upload PDF</a>
            </div>
        </div>
    </nav>

    <main class="pdf-viewer-container">
        <div class="pdf-controls">
            <button id="prevPage" class="btn-control">
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span class="page-info">
                Page: <span id="pageNum">1</span> / <span id="pageCount">1</span>
            </span>
            <button id="nextPage" class="btn-control">
                Next <i class="fas fa-chevron-right"></i>
            </button>
            <button id="zoomIn" class="btn-control">
                <i class="fas fa-search-plus"></i>
            </button>
            <button id="zoomOut" class="btn-control">
                <i class="fas fa-search-minus"></i>
            </button>
            <button id="downloadBtn" class="btn-download">
                <i class="fas fa-download"></i> Download PDF
            </button>
        </div>

        <div class="pdf-viewer">
            <canvas id="pdfCanvas"></canvas>
        </div>

        <div class="pdf-info" id="pdfInfo">
            <h3><i class="fas fa-file-pdf"></i> <span id="pdfTitle">Loading PDF...</span></h3>
            <p id="pdfMetadata">Loading metadata...</p>
        </div>
    </main>

    <footer>
        <p>PDF Share &copy; 2024 - Free PDF Hosting Service</p>
        <p class="footer-note">PDF.js is used for rendering PDF files in browser</p>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>
        // PDF Viewer functionality
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.5;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext).promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
                
                document.getElementById('pageNum').textContent = num;
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        // Get PDF from URL parameter
        function getPdfFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const pdfUrl = urlParams.get('pdf');
            
            if (pdfUrl) {
                // Load PDF using pdf.js
                pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc_) {
                    pdfDoc = pdfDoc_;
                    document.getElementById('pageCount').textContent = pdfDoc.numPages;
                    document.getElementById('pdfTitle').textContent = decodeURIComponent(pdfUrl.split('/').pop());
                    
                    // Set download button
                    document.getElementById('downloadBtn').onclick = function() {
                        window.open(pdfUrl, '_blank');
                    };
                    
                    renderPage(pageNum);
                }).catch(function(error) {
                    document.getElementById('pdfInfo').innerHTML = 
                        '<h3 style="color: #dc3545;"><i class="fas fa-exclamation-triangle"></i> Error Loading PDF</h3>' +
                        '<p>Please check if the PDF link is correct.</p>' +
                        '<a href="index.html" class="btn-primary">Go to Home</a>';
                });
            } else {
                document.getElementById('pdfInfo').innerHTML = 
                    '<h3 style="color: #dc3545;"><i class="fas fa-exclamation-triangle"></i> No PDF Specified</h3>' +
                    '<p>Please use a valid PDF sharing link.</p>' +
                    '<a href="index.html" class="btn-primary">Go to Home</a>';
            }
        }

        // Event listeners
        document.getElementById('prevPage').addEventListener('click', onPrevPage);
        document.getElementById('nextPage').addEventListener('click', onNextPage);
        document.getElementById('zoomIn').addEventListener('click', function() {
            scale += 0.25;
            queueRenderPage(pageNum);
        });
        document.getElementById('zoomOut').addEventListener('click', function() {
            if (scale > 0.5) {
                scale -= 0.25;
                queueRenderPage(pageNum);
            }
        });

        // Initialize when page loads
        window.onload = getPdfFromUrl;
    </script>
</body>
</html>
